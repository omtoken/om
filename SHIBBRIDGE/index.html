<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shib Mainnet Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fa;--card:#fff;--card2:#f0f2f5;--border:#e2e5ea;--border2:#d0d4db;
  --green:#0a8f3c;--green2:#0d6e30;--green-bg:rgba(10,143,60,.06);--green-border:rgba(10,143,60,.2);
  --red:#d1293d;--red-bg:rgba(209,41,61,.06);
  --amber:#c07800;--amber-bg:rgba(192,120,0,.06);
  --blue:#1a6dd1;--blue-bg:rgba(26,109,209,.06);
  --text:#1a1d23;--text2:#5a6270;--text3:#8b919d;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;
  --radius:14px;--radius-sm:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 4px 24px rgba(0,0,0,.08);
}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(10,143,60,.05),transparent)}

/* Layout */
.container{max-width:520px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;padding:0 4px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--green),#12b84d);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.logo-text{font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo-sub{font-size:11px;color:var(--text3);font-weight:500}

/* Wallet button */
.wallet-btn{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
  background:var(--card);border:1.5px solid var(--border);color:var(--text2);
  font-family:var(--mono);transition:all .2s;white-space:nowrap}
.wallet-btn:hover{border-color:var(--green);color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.wallet-btn.connected{border-color:var(--green-border);background:var(--green-bg);color:var(--green)}

/* Network badge */
.net-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:12px;
  font-size:11px;font-weight:600;background:var(--card2);color:var(--text3);border:1px solid var(--border);margin-top:6px}
.net-dot{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.net-dot.ok{background:var(--green);box-shadow:0 0 6px rgba(10,143,60,.4)}

/* Bridge card */
.bridge-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:28px 24px;box-shadow:var(--shadow)}

/* Direction selector */
.direction{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.dir-chain{flex:1;text-align:center;padding:16px 10px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .25s}
.dir-chain:hover{border-color:var(--border2)}
.dir-chain.active{border-color:var(--green);background:var(--green-bg)}
.dir-chain-name{font-weight:700;font-size:14px;margin-bottom:2px}
.dir-chain-sub{font-size:11px;color:var(--text3)}
.dir-arrow{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;flex-shrink:0}
.dir-arrow:hover{background:var(--green-bg);border-color:var(--green)}
.dir-arrow svg{width:18px;height:18px;stroke:var(--green);stroke-width:2.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}

/* Steps */
.steps{display:flex;gap:6px;margin-bottom:22px}
.step{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .4s}
.step.done{background:var(--green)}
.step.active{background:var(--green);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* Balance boxes */
.balance-row{display:flex;gap:10px;margin-bottom:22px}
.balance-box{flex:1;padding:14px;border-radius:var(--radius-sm);background:var(--card2);
  border:1px solid var(--border);text-align:center}
.balance-label{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:600;letter-spacing:.5px}
.balance-value{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text);word-break:break-all}
.balance-value.loading{color:var(--text3);font-size:12px;font-weight:400}

/* Input */
.input-group{margin-bottom:20px}
.input-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--text2);font-weight:500}
.max-btn{font-size:11px;color:var(--green);cursor:pointer;padding:3px 10px;border-radius:6px;
  background:var(--green-bg);border:1px solid var(--green-border);font-weight:600;transition:all .2s}
.max-btn:hover{background:rgba(10,143,60,.12)}
.input-wrap{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card);overflow:hidden;transition:border-color .2s}
.input-wrap:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.input-wrap input{flex:1;background:transparent;border:none;outline:none;padding:14px 16px;
  font-size:18px;color:var(--text);font-family:var(--mono);font-weight:600}
.input-wrap input::placeholder{color:var(--text3);font-weight:400}
.input-suffix{padding:0 16px;font-size:13px;font-weight:700;color:var(--green);letter-spacing:.5px;white-space:nowrap}

/* Info rows */
.info-rows{margin-bottom:22px;padding:12px 14px;background:var(--card2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px}
.info-row+.info-row{border-top:1px solid var(--border)}
.info-key{color:var(--text3);font-weight:500}
.info-val{color:var(--text2);font-family:var(--mono);font-size:11px;font-weight:500}

/* Buttons */
.btn{width:100%;padding:14px 20px;border:none;border-radius:var(--radius-sm);font-size:14px;
  font-weight:700;cursor:pointer;font-family:var(--sans);transition:all .2s;letter-spacing:.2px}
.btn-green{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;
  box-shadow:0 2px 12px rgba(10,143,60,.2)}
.btn-green:hover{box-shadow:0 4px 20px rgba(10,143,60,.3);transform:translateY(-1px)}
.btn-green:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:var(--card);border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--green);color:var(--green)}

/* Status message */
.msg-bar{margin-top:16px;padding:14px 16px;border-radius:var(--radius-sm);font-size:12px;
  line-height:1.6;display:none;border:1px solid var(--border)}
.msg-bar.show{display:block;animation:fadeUp .3s ease}
.msg-bar.info{background:var(--blue-bg);border-color:rgba(26,109,209,.15);color:#1a5bb0}
.msg-bar.success{background:var(--green-bg);border-color:var(--green-border);color:var(--green2)}
.msg-bar.error{background:var(--red-bg);border-color:rgba(209,41,61,.15);color:#a31d2e}
.msg-bar.warn{background:var(--amber-bg);border-color:rgba(192,120,0,.15);color:#8a5600}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Spinner */
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(10,143,60,.25);
  border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.footer{margin-top:32px;text-align:center;font-size:11px;color:var(--text3);line-height:1.8}
.footer a{color:var(--text2);text-decoration:none}
.footer a:hover{color:var(--green)}

/* Warning banner */
.warn-banner{padding:12px 16px;border-radius:var(--radius-sm);background:var(--amber-bg);
  border:1px solid rgba(192,120,0,.15);font-size:12px;color:#8a5600;margin-bottom:20px;line-height:1.5}

/* Responsive */
@media(max-width:560px){
  .container{padding:16px 12px 40px}
  .bridge-card{padding:20px 16px}
  .direction{gap:8px}
  .dir-chain{padding:12px 6px}
  .dir-chain-name{font-size:13px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <div class="logo">
        <div class="logo-icon">S</div>
        <div>
          <div class="logo-text">Shib Bridge</div>
        </div>
      </div>
      <div class="net-badge" id="netBadge">
        <span class="net-dot" id="netDot"></span>
        <span id="netLabel">未连接</span>
      </div>
    </div>
    <button class="wallet-btn" id="walletBtn" onclick="connectWallet()">连接钱包</button>
  </header>

  <div class="bridge-card">
    <!-- Direction -->
    <div class="direction">
      <div class="dir-chain active" id="dirFrom" onclick="setDirection('l1tol2')">
        <div class="dir-chain-name" id="fromName">以太坊</div>
        <div class="dir-chain-sub" id="fromSub">L1 · ETH 主网</div>
      </div>
      <div class="dir-arrow" id="dirArrow" onclick="toggleDirection()">
        <svg viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
      </div>
      <div class="dir-chain" id="dirTo" onclick="setDirection('l2tol1')">
        <div class="dir-chain-name" id="toName">Shib Mainnet</div>
        <div class="dir-chain-sub" id="toSub">L2 · Chain ID 5816</div>
      </div>
    </div>

    <!-- Steps -->
    <div class="steps" id="stepsBar">
      <div class="step" id="step1"></div>
      <div class="step" id="step2"></div>
      <div class="step" id="step3"></div>
    </div>

    <!-- Balances -->
    <div class="balance-row">
      <div class="balance-box">
        <div class="balance-label" id="balLabel1">L1 SHIB 余额</div>
        <div class="balance-value loading" id="bal1">连接钱包查看</div>
      </div>
      <div class="balance-box">
        <div class="balance-label" id="balLabel2">L2 SHIB 余额</div>
        <div class="balance-value loading" id="bal2">连接钱包查看</div>
      </div>
    </div>

    <!-- Amount -->
    <div class="input-group">
      <div class="input-label">
        <span>跨链数量</span>
        <span class="max-btn" onclick="setMax()">全部</span>
      </div>
      <div class="input-wrap">
        <input type="text" id="amountInput" placeholder="0.00" oninput="formatInput(this)">
        <span class="input-suffix">SHIB</span>
      </div>
    </div>

    <!-- Info -->
    <div class="info-rows">
      <div class="info-row"><span class="info-key">操作类型</span><span class="info-val" id="infoType">存款 (L1 → L2)</span></div>
      <div class="info-row"><span class="info-key">预计时间</span><span class="info-val" id="infoTime">约 10-15 分钟</span></div>
      <div class="info-row"><span class="info-key">Gas 费用</span><span class="info-val" id="infoGas">L1 Gas + L2 Gas (SHIB)</span></div>
    </div>

    <!-- Action -->
    <button class="btn btn-outline" id="mainBtn" onclick="mainAction()">连接钱包开始</button>
    <div class="msg-bar" id="bridgeStatus"></div>
  </div>

  <div class="footer">
    <div>Shib Mainnet · Chain ID 5816 · RPC: rpc.shib.world</div>
    <div>L1 Router: <a href="https://etherscan.io/address/0x1B0988B45b4F700Ec0b8A15524D7A025b79AC13E" target="_blank">0x1B09...C13E</a>
    &nbsp;·&nbsp; L2 Router: <a href="https://rpc.shib.world/" target="_blank">0xe5b5...10bB</a></div>
  </div>
</div>
<script>
// ===== CONFIG =====
const CFG = {
  L1_RPC: 'https://ethereum-rpc.publicnode.com',
  L2_RPC: 'https://rpc.shib.world/',
  L2_CHAIN_ID_HEX: '0x16B8',  // 5816
  L1_CHAIN_ID_HEX: '0x1',
  SHIB_L1: '0x95ad61b0a150d79219dcf64e1e6cc01f0b64c4ce',
  SHIB_L2: '0x2dbf635e1589b3ec0d04aa8d94cce0551e81a8a2',
  // Bridge contracts
  L1_ROUTER: '0x1B0988B45b4F700Ec0b8A15524D7A025b79AC13E',
  L1_STD_GW: '0x08cEf5036f1E29894932E1181d0cec79fDc330Ce',
  L2_ROUTER: '0xe5b5893E040fD80e7e53EE38058e6C34B8E510bB',
  L2_STD_GW: '0xDE4ba78D1105Ad20c466e9366A2d12b9fBe25d20',
  L2_NETWORK: {
    chainId: '0x16B8',
    chainName: 'Shib Mainnet',
    nativeCurrency: { name: 'SHIB', symbol: 'SHIB', decimals: 18 },
    rpcUrls: ['https://rpc.shib.world/'],
    blockExplorerUrls: []
  }
};

// ABIs
const ERC20_ABI = [
  'function balanceOf(address) view returns (uint256)',
  'function approve(address,uint256) returns (bool)',
  'function allowance(address,address) view returns (uint256)',
  'function decimals() view returns (uint8)'
];
// L1 Router: outboundTransfer(l1Token, to, amount, maxGas, gasPriceBid, maxSubmissionCost) payable
const L1_ROUTER_ABI = [
  'function outboundTransfer(address l1Token, address to, uint256 amount, uint256 maxGas, uint256 gasPriceBid, uint256 maxSubmissionCost) payable returns (bytes)'
];
// L2 StandardGateway: outboundTransfer(l1Token, to, amount, maxGas, gasPriceBid, data)
const L2_GW_ABI = [
  'function outboundTransfer(address l1Token, address to, uint256 amount, uint256 maxGas, uint256 gasPriceBid, bytes data) returns (bytes)'
];

// ===== STATE =====
let state = {
  connected: false,
  account: null,
  currentChain: null,
  bridgeDir: 'l1tol2',
  l1Balance: '0',
  l2Balance: '0'
};

const $ = id => document.getElementById(id);

// ===== RPC HELPERS (FIXED) =====
async function rpc(url, method, params) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params })
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return json.result;
}

// FIXED: encodeCall now correctly creates Interface from full ABI array
function encodeCall(abiArr, funcName, args) {
  const iface = new ethers.utils.Interface(abiArr);
  return iface.encodeFunctionData(funcName, args);
}

async function ethCall(url, to, data) {
  return rpc(url, 'eth_call', [{ to, data }, 'latest']);
}

function fmtSHIB(wei) {
  const n = BigInt(wei);
  const w = n / BigInt(10 ** 18);
  const f = (n % BigInt(10 ** 18)).toString().padStart(18, '0').slice(0, 4);
  const num = parseFloat(w.toString() + '.' + f);
  if (num === 0 && n > 0n) return '<0.0001';
  return num.toLocaleString(undefined, { maximumFractionDigits: 4 });
}

function showMsg(id, msg, type) {
  const el = $(id);
  el.className = 'msg-bar show ' + type;
  el.innerHTML = msg;
}

function clearMsg(id) {
  const el = $(id);
  el.className = 'msg-bar';
  el.innerHTML = '';
}

function setSteps(n) {
  for (let i = 1; i <= 3; i++) {
    $('step' + i).className = 'step' + (i < n ? ' done' : i === n ? ' active' : '');
  }
}

function shortAddr(a) { return a.slice(0, 6) + '...' + a.slice(-4); }

// ===== WALLET (FIXED) =====
async function connectWallet() {
  if (typeof window.ethereum === 'undefined') {
    alert('未检测到钱包，请安装 MetaMask');
    return;
  }
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    state.account = accounts[0].toLowerCase();
    state.connected = true;

    // FIXED: Don't force switch chain. Just detect current chain.
    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
    state.currentChain = chainId;

    updateWalletUI();
    refreshBridgeBalances();
  } catch (e) {
    console.error('Connect error:', e);
    showMsg('bridgeStatus', '连接失败: ' + (e.message || ''), 'error');
  }
}

function updateWalletUI() {
  if (!state.connected) return;
  const chainId = state.currentChain;
  const btn = $('walletBtn');
  btn.textContent = shortAddr(state.account);
  btn.className = 'wallet-btn connected';

  const dot = $('netDot');
  const label = $('netLabel');
  if (chainId === CFG.L1_CHAIN_ID_HEX) {
    dot.className = 'net-dot ok';
    label.textContent = '以太坊 L1';
  } else if (chainId === CFG.L2_CHAIN_ID_HEX) {
    dot.className = 'net-dot ok';
    label.textContent = 'Shib Mainnet L2';
  } else {
    dot.className = 'net-dot';
    label.textContent = '未知网络';
  }
  updateBridgeButton();
}

// ===== BRIDGE UI =====
function setDirection(dir) {
  state.bridgeDir = dir;
  updateBridgeUI();
}

function toggleDirection() {
  state.bridgeDir = state.bridgeDir === 'l1tol2' ? 'l2tol1' : 'l1tol2';
  updateBridgeUI();
}

function updateBridgeUI() {
  const isL1toL2 = state.bridgeDir === 'l1tol2';
  $('dirFrom').className = 'dir-chain' + (isL1toL2 ? ' active' : '');
  $('dirTo').className = 'dir-chain' + (isL1toL2 ? '' : ' active');
  $('fromName').textContent = isL1toL2 ? '以太坊' : 'Shib Mainnet';
  $('fromSub').textContent = isL1toL2 ? 'L1 · ETH 主网' : 'L2 · Chain ID 5816';
  $('toName').textContent = isL1toL2 ? 'Shib Mainnet' : '以太坊';
  $('toSub').textContent = isL1toL2 ? 'L2 · Chain ID 5816' : 'L1 · ETH 主网';
  $('balLabel1').textContent = isL1toL2 ? 'L1 SHIB 余额' : 'L2 SHIB 余额';
  $('balLabel2').textContent = isL1toL2 ? 'L2 SHIB 余额' : 'L1 SHIB 余额';
  $('infoTime').textContent = isL1toL2 ? '约 10-15 分钟' : '即时发起，7 天挑战期';
  $('infoGas').textContent = isL1toL2 ? 'L1 Gas (ETH) + L2 Gas (SHIB)' : 'L2 Gas (SHIB)';
  $('infoType').textContent = isL1toL2 ? '存款 (L1 → L2)' : '提款 (L2 → L1)';
  $('dirArrow').querySelector('svg').style.transform = isL1toL2 ? 'rotate(0deg)' : 'rotate(180deg)';
  if (state.connected) {
    updateBridgeButton();
    refreshBridgeBalances();
  }
}

function updateBridgeButton() {
  const btn = $('mainBtn');
  if (!state.connected) {
    btn.textContent = '连接钱包开始';
    btn.className = 'btn btn-outline';
    btn.disabled = false;
    return;
  }
  const isL1toL2 = state.bridgeDir === 'l1tol2';
  const needChain = isL1toL2 ? CFG.L1_CHAIN_ID_HEX : CFG.L2_CHAIN_ID_HEX;
  const chainId = state.currentChain;
  if (chainId !== needChain) {
    const needName = isL1toL2 ? '以太坊 L1' : 'Shib Mainnet L2';
    btn.textContent = '切换到 ' + needName;
    btn.className = 'btn btn-green';
    btn.disabled = false;
    return;
  }
  btn.textContent = isL1toL2 ? '授权并存款' : '授权并提款';
  btn.className = 'btn btn-green';
  btn.disabled = false;
}

// ===== BALANCE QUERIES (FIXED) =====
async function refreshBridgeBalances() {
  if (!state.account) return;
  $('bal1').className = 'balance-value loading';
  $('bal2').className = 'balance-value loading';
  $('bal1').textContent = '查询中...';
  $('bal2').textContent = '查询中...';

  try {
    // FIXED: use correct ABI array for encodeCall
    const balOfData = encodeCall(ERC20_ABI, 'balanceOf', [state.account]);

    // Use Promise.allSettled to handle L2 token not existing yet
    const [l1Result, l2Result] = await Promise.allSettled([
      ethCall(CFG.L1_RPC, CFG.SHIB_L1, balOfData),
      ethCall(CFG.L2_RPC, CFG.SHIB_L2, balOfData)
    ]);

    if (l1Result.status === 'fulfilled') {
      state.l1Balance = l1Result.value;
    }
    if (l2Result.status === 'fulfilled') {
      state.l2Balance = l2Result.value;
    }

    const isL1toL2 = state.bridgeDir === 'l1tol2';
    $('bal1').textContent = fmtSHIB(isL1toL2 ? state.l1Balance : state.l2Balance);
    $('bal2').textContent = l2Result.status === 'rejected' ? '尚未激活' : fmtSHIB(isL1toL2 ? state.l2Balance : state.l1Balance);
    $('bal1').className = 'balance-value';
    $('bal2').className = 'balance-value';
  } catch (e) {
    console.error('Balance error:', e);
    $('bal1').textContent = '查询失败';
    $('bal2').textContent = '查询失败';
    $('bal1').className = 'balance-value';
    $('bal2').className = 'balance-value';
  }
}

function formatInput(el) {
  let v = el.value.replace(/[^0-9.]/g, '');
  const parts = v.split('.');
  if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
  el.value = v;
}

function setMax() {
  const isL1toL2 = state.bridgeDir === 'l1tol2';
  const bal = isL1toL2 ? state.l1Balance : state.l2Balance;
  $('amountInput').value = fmtSHIB(bal).replace(/,/g, '');
}

// ===== MAIN ACTION =====
async function mainAction() {
  if (!state.connected) {
    await connectWallet();
    return;
  }
  const isL1toL2 = state.bridgeDir === 'l1tol2';
  const needChain = isL1toL2 ? CFG.L1_CHAIN_ID_HEX : CFG.L2_CHAIN_ID_HEX;
  const chainId = state.currentChain;

  // If on wrong chain, switch
  if (chainId !== needChain) {
    showMsg('bridgeStatus', '<span class="spinner"></span>正在切换网络...', 'info');
    $('mainBtn').disabled = true;
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: needChain }]
      });
      state.currentChain = needChain;
      updateWalletUI();
      clearMsg('bridgeStatus');
    } catch (e) {
      if (e.code === 4902) {
        // Chain not added, try to add it
        try {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [CFG.L2_NETWORK]
          });
          state.currentChain = needChain;
          updateWalletUI();
          clearMsg('bridgeStatus');
        } catch (e2) {
          showMsg('bridgeStatus', '添加网络失败: ' + (e2.message || ''), 'error');
          $('mainBtn').disabled = false;
        }
      } else {
        showMsg('bridgeStatus', '切换网络失败: ' + (e.message || ''), 'error');
        $('mainBtn').disabled = false;
      }
    }
    return;
  }

  // Validate amount
  const amountStr = $('amountInput').value.trim();
  if (!amountStr || parseFloat(amountStr) <= 0) {
    showMsg('bridgeStatus', '请输入有效的跨链数量', 'error');
    return;
  }

  if (isL1toL2) {
    await doDeposit(amountStr);
  } else {
    await doWithdraw(amountStr);
  }
}

// ===== DEPOSIT L1 → L2 (FIXED) =====
async function doDeposit(amountStr) {
  const amount = toWei(amountStr);
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();

  try {
    // Step 1: Approve L1 StandardGateway
    setSteps(1);
    showMsg('bridgeStatus', '<span class="spinner"></span>检查 SHIB 授权额度...', 'info');
    $('mainBtn').disabled = true;

    const shibContract = new ethers.Contract(CFG.SHIB_L1, ERC20_ABI, signer);
    const allowance = await shibContract.allowance(state.account, CFG.L1_ROUTER);
    if (allowance.lt(amount)) {
      showMsg('bridgeStatus', '<span class="spinner"></span>请在钱包中确认授权交易...', 'info');
      const approveTx = await shibContract.approve(CFG.L1_ROUTER, amount);
      showMsg('bridgeStatus', '<span class="spinner"></span>等待授权上链确认...', 'info');
      await approveTx.wait();
    }

    // Step 2: Deposit via L1 Router
    // FIXED: value = 0 for custom fee token chains (SHIB is native gas on L2)
    setSteps(2);
    showMsg('bridgeStatus', '<span class="spinner"></span>请在钱包中确认存款交易...', 'info');

    const l1Router = new ethers.Contract(CFG.L1_ROUTER, L1_ROUTER_ABI, signer);
    const maxGas = 200000;
    const gasPriceBid = ethers.utils.parseUnits('0.1', 'gwei');
    // 对于自定义 Gas 代币链，maxSubmissionCost 可以设为 0
    // 实际费用会在 L2 用 SHIB 扣除
    const maxSubmissionCost = 0;

    showMsg('bridgeStatus',
      '<span class="spinner"></span>发起存款交易（L1 Gas 费由钱包自动支付）...', 'info');

    const depositTx = await l1Router.outboundTransfer(
      CFG.SHIB_L1,
      state.account,
      amount,
      maxGas,
      gasPriceBid,
      maxSubmissionCost,
      { value: 0 }  // 自定义 Gas 代币链不需要发送 ETH
    );

    showMsg('bridgeStatus', '<span class="spinner"></span>等待 L1 确认（约 10-15 分钟）...', 'info');
    const receipt = await depositTx.wait();

    setSteps(3);
    showMsg(
      'bridgeStatus',
      '✅ 存款成功！<br>TX: <a href="https://etherscan.io/tx/' + receipt.transactionHash +
      '" target="_blank" style="color:var(--blue);font-family:var(--mono)">' + receipt.transactionHash.slice(0, 20) + '...</a>' +
      '<br>L2 将在约 10-15 分钟内收到 SHIB',
      'success'
    );
    $('mainBtn').disabled = false;
    setTimeout(() => refreshBridgeBalances(), 5000);
  } catch (e) {
    console.error('Deposit error:', e);
    let reason = e.message || '未知错误';
    if (e.data) reason = '合约错误: ' + (e.data.message || JSON.stringify(e.data));
    if (e.reason) reason = e.reason;
    showMsg('bridgeStatus', '❌ 存款失败: ' + reason, 'error');
    $('mainBtn').disabled = false;
    setSteps(0);
  }
}

// ===== WITHDRAW L2 → L1 (FIXED) =====
async function doWithdraw(amountStr) {
  const amount = toWei(amountStr);
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();

  try {
    // Step 1: Approve L2 StandardGateway
    setSteps(1);
    showMsg('bridgeStatus', '<span class="spinner"></span>检查 L2 SHIB 授权额度...', 'info');
    $('mainBtn').disabled = true;

    const l2Shib = new ethers.Contract(CFG.SHIB_L2, ERC20_ABI, signer);
    const allowance = await l2Shib.allowance(state.account, CFG.L2_STD_GW);
    if (allowance.lt(amount)) {
      showMsg('bridgeStatus', '<span class="spinner"></span>请在钱包中确认 L2 授权交易...', 'info');
      const approveTx = await l2Shib.approve(CFG.L2_STD_GW, amount);
      showMsg('bridgeStatus', '<span class="spinner"></span>等待 L2 授权确认...', 'info');
      await approveTx.wait();
    }

    // Step 2: Withdraw via L2 Router (FIXED: was calling L2_CUSTOM_GW directly)
    setSteps(2);
    showMsg('bridgeStatus', '<span class="spinner"></span>请在钱包中确认提款交易...', 'info');

    const l2Gateway = new ethers.Contract(CFG.L2_STD_GW, L2_GW_ABI, signer);
    const encodedData = ethers.utils.defaultAbiCoder.encode(['uint256'], [0]);

    const withdrawTx = await l2Gateway.outboundTransfer(
      CFG.SHIB_L1,       // l1Token address
      state.account,     // to
      amount,            // amount
      0,                 // maxGas (0 = auto)
      0,                 // gasPriceBid
      encodedData        // data
    );

    showMsg('bridgeStatus', '<span class="spinner"></span>等待 L2 确认...', 'info');
    const receipt = await withdrawTx.wait();

    setSteps(3);
    showMsg(
      'bridgeStatus',
      '✅ 提款发起成功！<br>TX: <span style="font-family:var(--mono)">' + receipt.transactionHash.slice(0, 20) + '...</span>' +
      '<br><br>后续步骤：<br>' +
      '1. 等待挑战期（约 7 天，Arbitrum 安全机制）<br>' +
      '2. 挑战期结束后，切换到以太坊 L1<br>' +
      '3. 在 L1 Outbox 执行最终确认领取 SHIB',
      'success'
    );
    $('mainBtn').disabled = false;
    setTimeout(() => refreshBridgeBalances(), 5000);
  } catch (e) {
    console.error('Withdraw error:', e);
    const reason = e.reason || e.data?.message || e.message || '未知错误';
    showMsg('bridgeStatus', '提款失败: ' + reason, 'error');
    $('mainBtn').disabled = false;
    setSteps(0);
  }
}

function toWei(str) {
  const parts = str.split('.');
  const whole = parts[0] || '0';
  let frac = (parts[1] || '').padEnd(18, '0').slice(0, 18);
  return BigInt(whole) * BigInt(10 ** 18) + BigInt(frac);
}

// ===== EVENT LISTENERS =====
if (typeof window.ethereum !== 'undefined') {
  if (typeof window.ethereum.on === 'function') {
    window.ethereum.on('accountsChanged', accounts => {
      if (accounts.length === 0) {
        state.connected = false;
        state.account = null;
        state.currentChain = null;
        $('netDot').className = 'net-dot';
        $('netLabel').textContent = '未连接';
        $('walletBtn').textContent = '连接钱包';
        $('walletBtn').className = 'wallet-btn';
        $('bal1').textContent = '连接钱包查看';
        $('bal2').textContent = '连接钱包查看';
        $('bal1').className = 'balance-value loading';
        $('bal2').className = 'balance-value loading';
        updateBridgeButton();
      } else {
        state.account = accounts[0].toLowerCase();
        state.connected = true;
        window.ethereum.request({ method: 'eth_chainId' }).then(chainId => {
          state.currentChain = chainId;
          updateWalletUI();
          refreshBridgeBalances();
        });
      }
    });
    window.ethereum.on('chainChanged', chainId => {
      state.currentChain = chainId;
      updateWalletUI();
      if (state.connected) refreshBridgeBalances();
    });
  }
}
</script>
