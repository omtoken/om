<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed Protocol — 控制面板</title>

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <!-- Ethers.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>

  <style>
    /* === CSS 变量 === */
    :root {
      --bg: #FAF7F2;
      --bg2: #FFF8EE;
      --card: #FFFFFF;
      --card-border: #EDE8E0;
      --text: #1A1612;
      --text2: #6B6560;
      --text3: #9C9590;
      --accent: #E8573F;
      --accent2: #FF7A5C;
      --accent-soft: #FFF0EC;
      --green: #2DA44E;
      --green-soft: #E6F9ED;
      --blue: #3B82F6;
      --blue-soft: #EBF3FF;
      --purple: #8B5CF6;
      --purple-soft: #F3EEFF;
      --gold: #D4A017;
      --gold-soft: #FFF8E1;
      --danger: #DC2626;
      --danger-soft: #FEF2F2;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
      --shadow-lg: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
    }

    /* === 基础重置 === */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === 顶部导航栏 === */
    .header {
      background: linear-gradient(135deg, #FFF8EE 0%, #FFF0EC 50%, #F3EEFF 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 0 32px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(232, 87, 63, 0.3);
    }
    .logo-text {
      font-family: "Instrument Serif", serif;
      font-size: 26px; font-weight: 400;
      letter-spacing: -0.5px; color: var(--text);
    }
    .logo-text em { color: var(--accent); font-style: italic; }

    .wallet-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 100px;
      border: 2px solid var(--card-border);
      background: var(--card); cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 600;
      color: var(--text); transition: 0.2s;
    }
    .wallet-btn:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .wallet-btn.connected { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .wallet-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* === 标签页导航 === */
    .nav-tabs {
      display: flex; gap: 4px;
      padding: 16px 32px 0;
      max-width: 1200px; margin: 0 auto;
    }
    .nav-tab {
      padding: 12px 24px;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      border: none; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 600;
      color: var(--text2); transition: 0.2s; position: relative;
    }
    .nav-tab:hover { color: var(--text); background: rgba(0,0,0,0.02); }
    .nav-tab.active { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }
    .nav-tab.active::after {
      content: ""; position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 40px; height: 3px;
      background: var(--accent); border-radius: 3px 3px 0 0;
    }
    .nav-tab .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; padding: 0 6px;
      border-radius: 100px; background: var(--accent);
      color: white; font-size: 11px; font-weight: 700; margin-left: 6px;
    }

    /* === 主内容区 === */
    .main { max-width: 1200px; margin: 0 auto; padding: 0 32px 64px; }
    .tab-content {
      display: none; background: var(--card);
      border-radius: 0 var(--radius) var(--radius) var(--radius);
      padding: 32px; box-shadow: var(--shadow);
      animation: fadeIn 0.3s ease;
    }
    .tab-content.active { display: block; }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* === 统计卡片 === */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      padding: 20px 24px; border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
    }
    .stat-card.accent  { background: linear-gradient(135deg, var(--accent-soft) 0%, #FFF5F0 100%); border-color: #FDDDD4; }
    .stat-card.green   { background: linear-gradient(135deg, var(--green-soft) 0%, #F0FFF5 100%);  border-color: #B8E6C8; }
    .stat-card.blue    { background: linear-gradient(135deg, var(--blue-soft) 0%, #F0F7FF 100%);   border-color: #BFD9FF; }
    .stat-card.purple  { background: linear-gradient(135deg, var(--purple-soft) 0%, #F8F4FF 100%); border-color: #D4C4FF; }
    .stat-card.gold    { background: linear-gradient(135deg, var(--gold-soft) 0%, #FFFCF0 100%);   border-color: #F0DFA0; }
    .stat-label {
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text3); margin-bottom: 8px;
    }
    .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
    .stat-value.small { font-size: 18px; }
    .stat-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }

    /* === 分区标题 === */
    .section-title {
      font-family: "Instrument Serif", serif;
      font-size: 22px; font-weight: 400;
      margin-bottom: 20px; padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      display: flex; align-items: center; gap: 10px;
    }
    .section-title .icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    /* === 分红列表 === */
    .dividend-list { display: flex; flex-direction: column; gap: 12px; }
    .dividend-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-radius: var(--radius-sm);
      border: 1px solid var(--card-border); background: var(--bg);
      transition: 0.2s;
    }
    .dividend-row:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .dividend-info { display: flex; align-items: center; gap: 16px; }
    .dividend-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
    }
    .dividend-icon.eth  { background: linear-gradient(135deg, #627EEA, #8B9FFF); color: white; }
    .dividend-icon.shib { background: linear-gradient(135deg, #FFA409, #FFD060); color: white; }
    .dividend-icon.bone { background: linear-gradient(135deg, #C5A55A, #E8D5A0); color: white; }
    .dividend-name { font-weight: 600; font-size: 16px; }
    .dividend-addr { font-size: 12px; color: var(--text3); font-family: monospace; }
    .dividend-amount { text-align: right; margin-right: 16px; }
    .dividend-amount .value { font-size: 20px; font-weight: 700; color: var(--text); }
    .dividend-amount .label { font-size: 12px; color: var(--text3); }

    /* === 按钮 === */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 20px; border-radius: 100px; border: none;
      cursor: pointer; font-family: inherit;
      font-size: 14px; font-weight: 600;
      transition: 0.2s; white-space: nowrap;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; box-shadow: 0 2px 8px rgba(232, 87, 63, 0.3);
    }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(232, 87, 63, 0.4); transform: translateY(-1px); }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--card-border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--text3); }
    .btn-green {
      background: linear-gradient(135deg, var(--green), #34D058);
      color: white; box-shadow: 0 2px 8px rgba(45, 164, 78, 0.3);
    }
    .btn-green:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(45, 164, 78, 0.4); transform: translateY(-1px); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgb(254, 202, 202); }
    .btn-danger:hover:not(:disabled) { background: #FEE2E2; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }

    /* === 表单 === */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
    .form-input, .form-select {
      width: 100%; padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--bg); font-family: inherit;
      font-size: 14px; color: var(--text); transition: 0.2s;
    }
    .form-input:focus, .form-select:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .form-input::placeholder { color: var(--text3); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* === 管理员面板 === */
    .owner-section {
      margin-bottom: 32px; padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
    }
    .owner-section:last-child { border-bottom: none; }
    .owner-section-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 16px;
    }
    .owner-section-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .owner-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 100px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 12px; font-weight: 700;
    }
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .config-card {
      padding: 20px; border-radius: var(--radius-sm);
      border: 1px solid var(--card-border); background: var(--bg);
    }
    .config-card-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

    /* === 表格 === */
    .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--card-border); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left; padding: 12px 16px;
      background: var(--bg); font-weight: 600;
      font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text3);
      border-bottom: 1px solid var(--card-border);
    }
    td { padding: 12px 16px; border-bottom: 1px solid var(--card-border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg); }
    .mono { font-family: monospace; font-size: 13px; }

    /* === 标签 & 提示 === */
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .tag-green { background: var(--green-soft); color: var(--green); }
    .tag-red   { background: var(--danger-soft); color: var(--danger); }
    .tag-blue  { background: var(--blue-soft); color: var(--blue); }

    .toast-container {
      position: fixed; bottom: 24px; right: 24px;
      z-index: 9999; display: flex;
      flex-direction: column; gap: 8px;
    }
    .toast {
      padding: 14px 20px; border-radius: var(--radius-sm);
      background: var(--card); box-shadow: var(--shadow-lg);
      border-left: 4px solid var(--green);
      font-size: 14px; font-weight: 500;
      max-width: 400px; animation: slideIn 0.3s ease;
    }
    .toast.error { border-left-color: var(--danger); }
    .toast.info  { border-left-color: var(--blue); }
    @keyframes slideIn {
      0% { opacity: 0; transform: translateX(40px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* === 加载 & 空状态 === */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid white; border-top-color: rgba(255,255,255,0.3);
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(250, 247, 242, 0.8);
      display: flex; align-items: center; justify-content: center;
      z-index: 9998; backdrop-filter: blur(4px);
    }
    .loading-overlay .spinner {
      width: 40px; height: 40px; border-width: 3px;
      border-top-color: var(--accent);
    }

    .empty-state { text-align: center; padding: 48px 24px; color: var(--text3); }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state .title { font-size: 18px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }

    .connect-prompt { text-align: center; padding: 80px 24px; }
    .connect-prompt .icon { font-size: 64px; margin-bottom: 24px; }
    .connect-prompt .title { font-family: "Instrument Serif", serif; font-size: 28px; margin-bottom: 12px; }
    .connect-prompt .desc { color: var(--text2); margin-bottom: 24px; }

    /* === 响应式 === */
    @media (max-width: 768px) {
      .header { padding: 0 16px; }
      .nav-tabs { padding: 12px 16px 0; overflow-x: auto; }
      .main { padding: 0 16px 48px; }
      .tab-content { padding: 20px; }
      .stats-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .dividend-row { flex-direction: column; gap: 12px; align-items: flex-start; }
      .dividend-amount { text-align: left; margin-right: 0; }
    }
  </style>
</head>
<body>

  <!-- 顶部导航栏 -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">F</div>
      <div class="logo-text">Feed <em>Protocol</em></div>
    </div>
    <button class="wallet-btn" id="walletBtn">
      <span id="walletBtnContent">连接钱包</span>
    </button>
  </header>

  <!-- 标签页 -->
  <div class="nav-tabs" id="navTabs">
    <button class="nav-tab active" data-tab="dashboard">控制面板</button>
    <button class="nav-tab" data-tab="claim">领取分红</button>
    <button class="nav-tab" data-tab="owner" id="ownerTab" style="display:none">管理员面板</button>
  </div>

  <!-- 主内容区 -->
  <div class="main">

    <!-- 控制面板 -->
    <div class="tab-content active" id="tab-dashboard">
      <div id="dashboardContent">
        <div class="connect-prompt">
          <div class="icon">🔗</div>
          <div class="title">连接您的钱包</div>
          <div class="desc">连接钱包以查看您的 FEED 持仓和分红信息</div>
          <button class="btn btn-primary">连接钱包</button>
        </div>
      </div>
    </div>

    <!-- 领取分红 -->
    <div class="tab-content" id="tab-claim">
      <div id="claimContent">
        <div class="connect-prompt">
          <div class="icon">💰</div>
          <div class="title">领取您的分红</div>
          <div class="desc">连接钱包以查看并领取可领取的分红</div>
          <button class="btn btn-primary">连接钱包</button>
        </div>
      </div>
    </div>

    <!-- 管理员面板 -->
    <div class="tab-content" id="tab-owner">
      <div id="ownerContent"></div>
    </div>

  </div>

  <!-- 提示消息容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ========================================
    // 合约配置
    // ========================================
    const CONTRACTS = {
      dividendHub: '0xcc06722d393c3Eb54Cd55f86c4E49b0DDcEB86C8',
      launchpad:   '0xd8B0F2A189178A21939bcD74C39dB86dA0a29F07',
      factory:     '0x1DA2EA5a076E6d61dE95a0B98cba1D14dB07e8A1',
      feedToken:   '0x98508DA82F9a8D6Cb1C3c8Af4940B59b63bc68cf',
    };

    const DIVIDEND_TOKENS = [
      { name: 'ETH',  symbol: 'ETH',  address: '0x0000000000000000000000000000000000000000', icon: 'eth',  decimals: 18 },
      { name: 'SHIB', symbol: 'SHIB', address: '0x95aD61b0a150d79219dCF64E1E6Cc01f0B64C4cE', icon: 'shib', decimals: 18 },
      { name: 'BONE', symbol: 'BONE', address: '0x9813037ee2218799597d83D4a5B6F3b6778218d9', icon: 'bone', decimals: 18 },
    ];

    // ========================================
    // ABI 定义
    // ========================================
    const ABI = {
      feedToken: [
        'function balanceOf(address) view returns (uint256)',
        'function totalSupply() view returns (uint256)',
        'function owner() view returns (address)',
        'function dividendHub() view returns (address)',
        'function isBlacklisted(address) view returns (bool)',
        'function setDividendBlacklist(address, bool)',
        'function setDividendBlacklistBatch(address[], bool)',
        'function transferOwnership(address)',
      ],
      dividendHub: [
        'function feedToken() view returns (address)',
        'function launchpad() view returns (address)',
        'function platform() view returns (address)',
        'function totalShares() view returns (uint256)',
        'function shares(address) view returns (uint256)',
        'function dividendTokenCount() view returns (uint256)',
        'function dividendTokens(uint256) view returns (address)',
        'function isRegisteredDivToken(address) view returns (bool)',
        'function sourceTokenCount() view returns (uint256)',
        'function withdrawableDividendOf(address, address) view returns (uint256)',
        'function accumulativeDividendOf(address, address) view returns (uint256)',
        'function claim(address) returns (uint256)',
        'function syncAccount(address)',
      ],
      launchpad: [
        'function owner() view returns (address)',
        'function factory() view returns (address)',
        'function dividendHub() view returns (address)',
        'function minBuybackEth() view returns (uint256)',
        'function dividendBlacklist(address) view returns (bool)',
        'function buybackPoolConfig(address) view returns (bool configured, uint8 dex, uint24 fee, int24 tickSpacing, address hooks)',
        'function transferOwnership(address)',
        'function setFactory(address)',
        'function setDividendHub(address)',
        'function setPlatform(address)',
        'function setMinBuybackEth(uint256)',
        'function setDividendBlacklist(address, bool)',
        'function setDividendBlacklistBatch(address[], bool)',
        'function setBuybackPool(address, uint8, uint24, int24, address)',
        'function removeBuybackPool(address)',
        'function rescueERC20(address, address)',
      ],
      factory: [
        'function owner() view returns (address)',
        'function launchpad() view returns (address)',
        'function feedToken() view returns (address)',
        'function publicLaunchEnabled() view returns (bool)',
        'function launchWhitelist(address) view returns (bool)',
        'function totalLaunches() view returns (uint256)',
        'function transferOwnership(address)',
        'function setPublicLaunchEnabled(bool)',
        'function setLaunchWhitelist(address, bool)',
        'function setLaunchWhitelistBatch(address[], bool)',
      ],
    };

    // ========================================
    // 全局状态
    // ========================================
    let provider   = null;
    let signer     = null;
    let userAddress = null;
    let isOwner    = false;
    let contracts  = {};

    // ========================================
    // 工具函数
    // ========================================

    /** 地址缩写: 0x1234...5678 */
    function fmtAddr(a) {
      return a ? a.slice(0, 6) + '...' + a.slice(-4) : '—';
    }

    /** 大数简写: 1.23M / 4.56K */
    function fmtNum(n, d = 4) {
      if (!n) return '0';
      const f = parseFloat(ethers.formatUnits(n, d > 4 ? 18 : d));
      if (f > 1e9) return (f / 1e9).toFixed(2) + 'B';
      if (f > 1e6) return (f / 1e6).toFixed(2) + 'M';
      if (f > 1e3) return (f / 1e3).toFixed(2) + 'K';
      return f.toFixed(d);
    }

    /** 完整数字格式化（带千分位） */
    function fmtFull(n, dec = 18) {
      if (!n) return '0';
      return parseFloat(ethers.formatUnits(n, dec))
        .toLocaleString('zh-CN', { maximumFractionDigits: 4 });
    }

    /** 弹出提示消息 */
    function toast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    /** 交易包装：提交 → 等待确认 → 提示 */
    async function txWrap(promise, successMsg) {
      try {
        const tx = await promise;
        toast('交易已提交...', 'info');
        await tx.wait();
        toast(successMsg || '交易已确认！');
        return tx;
      } catch (e) {
        const msg = e.reason || e.message || '交易失败';
        toast(msg, 'error');
        throw e;
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');

      if (tab === 'claim' && userAddress) loadClaimData();
      if (tab === 'owner' && userAddress && isOwner) loadOwnerData();
    }

    // ========================================
    // 钱包连接
    // ========================================
    async function connectWallet() {
      if (!window.ethereum) {
        toast('请安装 MetaMask 或其他 Web3 钱包', 'error');
        return;
      }
      try {
        provider = new ethers.BrowserProvider(window.ethereum);
        const accounts = await provider.send('eth_requestAccounts', []);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();

        // 检查网络
        const network = await provider.getNetwork();
        if (network.chainId !== 1n) {
          toast('请切换到以太坊主网', 'error');
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: '0x1' }]
            });
          } catch (e) { /* 用户可能取消 */ }
        }

        // 初始化合约实例
        contracts.feed      = new ethers.Contract(CONTRACTS.feedToken,   ABI.feedToken,   signer);
        contracts.hub       = new ethers.Contract(CONTRACTS.dividendHub, ABI.dividendHub, signer);
        contracts.launchpad = new ethers.Contract(CONTRACTS.launchpad,   ABI.launchpad,   signer);
        contracts.factory   = new ethers.Contract(CONTRACTS.factory,     ABI.factory,     signer);

        // 检查是否为管理员（任一合约的 owner）
        const [factoryOwner, launchpadOwner, feedOwner] = await Promise.all([
          contracts.factory.owner(),
          contracts.launchpad.owner(),
          contracts.feed.owner(),
        ]);
        isOwner = (
          userAddress.toLowerCase() === factoryOwner.toLowerCase()   ||
          userAddress.toLowerCase() === launchpadOwner.toLowerCase() ||
          userAddress.toLowerCase() === feedOwner.toLowerCase()
        );

        // 更新界面
        updateWalletUI();
        await loadDashboard();
        if (isOwner) {
          document.getElementById('ownerTab').style.display = '';
        }
        toast('钱包已连接：' + fmtAddr(userAddress));

      } catch (e) {
        toast('连接失败：' + (e.message || e), 'error');
      }
    }

    function updateWalletUI() {
      const btn     = document.getElementById('walletBtn');
      const content = document.getElementById('walletBtnContent');
      btn.classList.add('connected');
      content.innerHTML = `<span class="wallet-dot"></span> ${fmtAddr(userAddress)}`;
    }

    // --- 设置 ---
    async function setMinBuyback() {
      const val = document.getElementById('minBuybackInput').value;
      if (!val || parseFloat(val) <= 0) return toast('金额无效', 'error');
      try {
        const wei = ethers.parseEther(val);
        await txWrap(
          contracts.launchpad.setMinBuybackEth(wei),
          `最低回购已设置为 ${val} ETH`
        );
      } catch (e) { /* txWrap 已处理 */ }
    }

    async function setPublicLaunch(enable) {
      try {
        await txWrap(
          contracts.factory.setPublicLaunchEnabled(enable),
          `公开启动已${enable ? '启用' : '禁用'}`
        );
        loadOwnerData();
      } catch (e) { /* txWrap 已处理 */ }
    }

    async function setPlatform() {
      const addr = document.getElementById('platformInput').value.trim();
      if (!ethers.isAddress(addr)) return toast('地址无效', 'error');
      try {
        await txWrap(
          contracts.launchpad.setPlatform(addr),
          '平台地址已更新'
        );
      } catch (e) { /* txWrap 已处理 */ }
    }

    // --- 转移所有权 ---
    async function transferAllOwnership() {
      const addr = document.getElementById('newOwnerAddr').value.trim();
      if (!ethers.isAddress(addr)) return toast('地址无效', 'error');
      if (!confirm(`将所有合约的所有权（工厂、启动台、FeedToken）转移至 ${addr}？此操作不可撤销。`)) return;
      try {
        await txWrap(contracts.factory.transferOwnership(addr),   'TokenFactory 所有权已转移');
        await txWrap(contracts.launchpad.transferOwnership(addr), 'FeedLaunchpad 所有权已转移');
        await txWrap(contracts.feed.transferOwnership(addr),      'FeedToken 所有权已转移');
        toast('全部所有权已转移！', 'success');
        isOwner = false;
        document.getElementById('ownerTab').style.display = 'none';
        switchTab('dashboard');
      } catch (e) { /* txWrap 已处理 */ }
    }

    // --- 救援 ERC20 ---
    async function rescueERC20() {
      const addr = document.getElementById('rescueTokenAddr').value.trim();
      if (!ethers.isAddress(addr)) return toast('地址无效', 'error');
      if (!confirm(`将 ${addr} 的代币从启动台救援到您的地址？`)) return;
      try {
        await txWrap(
          contracts.launchpad.rescueERC20(addr, userAddress),
          '代币已救援'
        );
      } catch (e) { /* txWrap 已处理 */ }
    }
    // ========================================
    // 事件绑定
    // ========================================

    // 标签页切换
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    // 钱包连接按钮
    document.getElementById('walletBtn').addEventListener('click', connectWallet);
    document.querySelectorAll('.connect-prompt .btn-primary').forEach(btn => {
      btn.addEventListener('click', connectWallet);
    });

    // 账户/链切换时自动刷新
    if (window.ethereum) {
      window.ethereum.on('accountsChanged', () => location.reload());
      window.ethereum.on('chainChanged', () => location.reload());
    }
  </script>

</body>
</html>
