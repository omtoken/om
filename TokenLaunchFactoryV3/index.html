<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokenLaunchFactory V3 发币工具</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<style>
:root { --bg:#0b1020; --card:#111936; --card2:#0f172f; --text:#edf2ff; --muted:#95a3c7; --line:#243052; --brand:#7c5cff; --ok:#27d39b; --bad:#ff5f7a; --warn:#ffc857; }
* { box-sizing:border-box }
body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top left,#1b2b6b 0,#0b1020 34%,#070b16 100%); color:var(--text); }
main { max-width:1080px; margin:0 auto; padding:28px 18px 60px; }
.hero { display:flex; justify-content:space-between; gap:18px; align-items:flex-start; margin-bottom:18px; }
h1 { margin:0 0 8px; font-size:30px; letter-spacing:-.04em; }
p { color:var(--muted); line-height:1.6; margin:0; }
.card { background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025)); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 18px 60px rgba(0,0,0,.28); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.full { grid-column:1/-1 }
label { display:block; color:#c9d3f3; font-size:13px; margin:0 0 7px; }
input { width:100%; border:1px solid var(--line); background:#080d1d; color:var(--text); border-radius:12px; padding:12px 13px; outline:none; font-size:14px; }
input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(124,92,255,.18); }
button { border:0; border-radius:12px; padding:12px 14px; color:white; background:linear-gradient(135deg,#7c5cff,#25a7ff); font-weight:700; cursor:pointer; }
button.secondary { background:#1a2545; color:#dce5ff; border:1px solid var(--line); }
button.danger { background:#3a1721; color:#ffd9df; border:1px solid #6a2a3a; }
button:disabled { opacity:.5; cursor:not-allowed; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.stat { background:#081027; border:1px solid var(--line); padding:12px; border-radius:14px; min-height:72px; }
.stat b { display:block; font-size:12px; color:var(--muted); margin-bottom:7px; }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-all; }
.ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
.log { height:190px; overflow:auto; background:#060a15; border:1px solid var(--line); border-radius:14px; padding:12px; font-size:12px; color:#b9c5e8; }
.badge { display:inline-flex; gap:7px; align-items:center; padding:8px 10px; border-radius:999px; background:#101a39; border:1px solid var(--line); color:#cbd7ff; font-size:12px; }
hr { border:0; border-top:1px solid var(--line); margin:16px 0; }
@media (max-width:760px) { .hero,.grid { grid-template-columns:1fr; display:grid; } .full { grid-column:auto; } }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div>
      <h1>TokenLaunchFactory V3 发币工具</h1>
      <p>连接钱包后填写参数，本地挖 salt，预测地址末尾满足指定后缀，例如 <span class="mono">8888</span>，再调用最终工厂合约发币。</p>
    </div>
    <button id="connectBtn">连接钱包</button>
  </section>

  <section class="card">
    <div class="row">
      <span class="badge">Factory <span class="mono">0x6C64B33D3d7D90382A9eE64eAd361854B9A4B734</span></span>
      <span class="badge">Locker <span class="mono">0xb89836Bdb91B0c90a28EB5c10622785B33EE109e</span></span>
      <span class="badge">Chain BSC 56</span>
    </div>
    <hr>
    <div class="grid">
      <div><label>代币名称</label><input id="name" value="My Token"></div>
      <div><label>代币符号</label><input id="symbol" value="MTK"></div>
      <div><label>营销税 %，0 到 10</label><input id="taxPercent" value="3" inputmode="decimal"></div>
      <div><label>营销钱包</label><input id="marketingWallet" placeholder="0x..."></div>
      <div><label>发射时自己购买多少 BNB</label><input id="devBnb" value="0" inputmode="decimal"></div>
      <div><label>初始流动性补充 BNB，默认不用改</label><input id="seedBnb" value="0.0001" inputmode="decimal"></div>
      <div><label>目标地址后缀</label><input id="suffix" value="8888"></div>
      <div class="full"><label>自定义挖矿前缀</label><input id="saltPrefix" value="mulerun-launch"></div>
    </div>
    <hr>
    <div class="row">
      <button id="mineBtn">开始挖 salt</button>
      <button id="stopBtn" class="danger" disabled>停止</button>
      <button id="verifyBtn" class="secondary">链上验证预测</button>
      <button id="launchBtn" disabled>发币</button>
    </div>
  </section>

  <section class="grid" style="margin-top:16px">
    <div class="stat"><b>钱包</b><div id="wallet" class="mono">未连接</div></div>
    <div class="stat"><b>状态</b><div id="status">等待操作</div></div>
    <div class="stat full"><b>挖到的 salt</b><div id="salt" class="mono">-</div></div>
    <div class="stat full"><b>预测代币地址</b><div id="predicted" class="mono">-</div></div>
    <div class="stat"><b>营销税 bps</b><div id="taxBps">-</div></div>
    <div class="stat"><b>交易 value</b><div id="totalValue">-</div></div>
  </section>

  <section class="card" style="margin-top:16px">
    <label>日志</label>
    <div id="log" class="log mono"></div>
  </section>
</main>

const CHAIN_ID = 56n;
const FACTORY_ABI = [
  "function predictTokenAddress(string name,string symbol,uint16 marketingTaxBps,address marketingWallet,address creator,bytes32 salt) view returns (address)",
  "function createAndLaunch(string name,string symbol,uint16 marketingTaxBps,address marketingWallet,bytes32 salt,uint256 devBnbAmount,uint256 minDevTokenAmount) payable returns (address tokenAddress,uint256 tokenId,uint256 launchId,address pool)",
  "function owner() view returns (address)",
  "function platformFeeBps() view returns (uint16)",
  "function totalLaunches() view returns (uint256)"
];
let provider, signer, account, mining=false, minedSalt=null, minedAddress=null, minedParamsHash=null;
const $ = (id) => document.getElementById(id);
function log(msg, cls='') { const d=document.createElement('div'); d.className=cls; d.textContent='['+new Date().toLocaleTimeString()+'] '+msg; $('log').prepend(d); }
function setStatus(msg, cls='') { $('status').innerHTML = cls ? '<span class="'+cls+'">'+msg+'</span>' : msg; }
function cleanSuffix(s) { return s.toLowerCase().replace(/^0x/,'').trim(); }
function parseTaxBps() { const v=Number($('taxPercent').value); if(!Number.isFinite(v)||v<0||v>10) throw new Error('营销税必须在 0 到 10 之间'); return Math.round(v*100); }
function getParams() {
  if(!account) throw new Error('请先连接钱包');
  const name=$('name').value.trim(); const symbol=$('symbol').value.trim();
  if(!name||!symbol) throw new Error('名称和符号不能为空');
  const taxBps=parseTaxBps();
  const marketing=$('marketingWallet').value.trim() || account;
  if(!ethers.isAddress(marketing)) throw new Error('营销钱包地址不正确');
  const suffix=cleanSuffix($('suffix').value);
  if(!/^[0-9a-f]+$/.test(suffix) || suffix.length>40) throw new Error('后缀必须是十六进制字符');
  const devBnb=ethers.parseEther(($('devBnb').value||'0').trim());
  const seedBnb=ethers.parseEther(($('seedBnb').value||'0').trim());
  const minDevToken=0n;
  return {name,symbol,taxBps,marketing,suffix,devBnb,seedBnb,minDevToken,creator:account};
}
function paramsHash(p) { return ethers.keccak256(ethers.toUtf8Bytes(JSON.stringify({name:p.name,symbol:p.symbol,taxBps:p.taxBps,marketing:p.marketing.toLowerCase(),creator:p.creator.toLowerCase()}))); }
function initCodeHash(p) {
  const encoded = ethers.AbiCoder.defaultAbiCoder().encode(['string','string','uint16','address','address','address'], [p.name,p.symbol,p.taxBps,p.marketing,p.creator,LOCKER]);
  return ethers.keccak256(ethers.concat([STANDARD_TOKEN_BYTECODE, encoded]));
}
function createSalt(prefix, account, counter) { return ethers.keccak256(ethers.toUtf8Bytes(prefix + ':' + account.toLowerCase() + ':' + counter.toString())); }
async function ensureBsc() {
  const net = await provider.getNetwork();
  if(net.chainId !== CHAIN_ID) {
    await window.ethereum.request({ method:'wallet_switchEthereumChain', params:[{ chainId:'0x38' }] });
  }
}
$('connectBtn').onclick = async () => {
  if(!window.ethereum) { alert('没有检测到钱包插件'); return; }
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send('eth_requestAccounts', []);
  await ensureBsc();
  signer = await provider.getSigner();
  account = await signer.getAddress();
  $('wallet').textContent = account;
  if(!$('marketingWallet').value) $('marketingWallet').value = account;
  setStatus('钱包已连接','ok'); log('已连接钱包 '+account);
};
$('mineBtn').onclick = async () => {
  try {
    const p=getParams(); const h=paramsHash(p); const codeHash=initCodeHash(p); const prefix=$('saltPrefix').value.trim()||'mulerun-launch';
    mining=true; minedSalt=null; minedAddress=null; minedParamsHash=null; $('mineBtn').disabled=true; $('stopBtn').disabled=false; $('launchBtn').disabled=true;
    let counter=0n; const started=Date.now(); setStatus('挖矿中'); log('开始本地挖 salt，目标后缀 '+p.suffix);
    while(mining) {
      for(let i=0;i<3000;i++) {
        const salt=createSalt(prefix, p.creator, counter++);
        const addr=ethers.getCreate2Address(FACTORY, salt, codeHash);
        if(addr.toLowerCase().endsWith(p.suffix)) {
          minedSalt=salt; minedAddress=addr; minedParamsHash=h; mining=false;
          $('salt').textContent=salt; $('predicted').textContent=addr; $('launchBtn').disabled=false;
          setStatus('已挖到目标地址','ok'); log('成功：'+addr+' salt='+salt,'ok'); break;
        }
      }
      if(counter % 30000n === 0n) {
        const sec=Math.max(1,(Date.now()-started)/1000); setStatus('已尝试 '+counter.toString()+' 次，速度 '+Math.round(Number(counter)/sec)+'/s');
      }
      await new Promise(r=>setTimeout(r,0));
    }
  } catch(e) { setStatus(e.message,'bad'); log(e.message,'bad'); }
  $('mineBtn').disabled=false; $('stopBtn').disabled=true;
};
$('stopBtn').onclick = () => { mining=false; setStatus('已停止','warn'); log('已停止挖矿'); };
$('verifyBtn').onclick = async () => {
  try {
    if(!provider||!account) throw new Error('请先连接钱包');
    const p=getParams(); const salt = minedSalt || $('salt').textContent.trim();
    if(!/^0x[0-9a-fA-F]{64}$/.test(salt)) throw new Error('还没有可用 salt');
    const f = new ethers.Contract(FACTORY, FACTORY_ABI, provider);
    const onchain = await f.predictTokenAddress(p.name,p.symbol,p.taxBps,p.marketing,p.creator,salt);
    const local = ethers.getCreate2Address(FACTORY, salt, initCodeHash(p));
    $('predicted').textContent=local;
    if(onchain.toLowerCase()===local.toLowerCase()) { setStatus('链上预测一致','ok'); log('链上预测一致：'+onchain,'ok'); }
    else { setStatus('预测不一致','bad'); log('链上 '+onchain+' 本地 '+local,'bad'); }
  } catch(e) { setStatus(e.message,'bad'); log(e.message,'bad'); }
};
$('launchBtn').onclick = async () => {
  try {
    if(!signer||!account) throw new Error('请先连接钱包');
    const p=getParams();
    if(!minedSalt || minedParamsHash !== paramsHash(p)) throw new Error('参数已变化，请重新挖 salt');
    const value = p.devBnb + p.seedBnb;
    $('taxBps').textContent = p.taxBps.toString(); $('totalValue').textContent = ethers.formatEther(value)+' BNB';
    await ensureBsc();
    const f = new ethers.Contract(FACTORY, FACTORY_ABI, signer);
    setStatus('等待钱包确认交易'); log('发起发币交易，value '+ethers.formatEther(value)+' BNB');
    const tx = await f.createAndLaunch(p.name,p.symbol,p.taxBps,p.marketing,minedSalt,p.devBnb,p.minDevToken,{value});
    setStatus('交易已提交'); log('Tx '+tx.hash,'ok');
    const receipt = await tx.wait();
    setStatus('发币成功','ok'); log('成功，区块 '+receipt.blockNumber,'ok');
  } catch(e) { setStatus(e.shortMessage||e.message,'bad'); log(e.shortMessage||e.message,'bad'); }
};
['name','symbol','taxPercent','marketingWallet','devBnb','seedBnb'].forEach(id=>$(id).addEventListener('input',()=>{ minedSalt=null; minedParamsHash=null; $('launchBtn').disabled=true; }));
setInterval(()=>{ try { const p=getParams(); $('taxBps').textContent=p.taxBps; $('totalValue').textContent=ethers.formatEther(p.devBnb+p.seedBnb)+' BNB'; } catch(_) {} },700);
</script>
