<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链上 NFT 随机生成器</title>
    <!-- 引入 Tailwind CSS 用于美观的界面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <style>
        .nft-bg {
            background-color: #f3f4f6;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 max-w-2xl w-full">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">🎲 链上 NFT 随机生成器</h1>
            <p class="text-gray-500 text-sm">数据直接从 BSC 主网合约实时读取，无需连接钱包</p>
            <p class="text-gray-400 text-xs mt-1">合约: 0x17e1c9844052d6CC9Fb1dCd7Ed2646673Bca3080</p>
        </div>

        <!-- 图片预览区 -->
        <div class="nft-bg rounded-xl border-2 border-gray-200 flex items-center justify-center mb-6 overflow-hidden" style="width: 100%; max-width: 500px; height: 500px; margin: 0 auto;">
            <img id="nftImage" src="" alt="NFT Preview" class="hidden w-full h-full object-contain">
            <div id="placeholder" class="text-gray-400 text-lg font-medium">点击下方按钮开始生成</div>
            
            <!-- Loading 动画 -->
            <div id="loading" class="hidden flex-col items-center justify-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-500 mb-3"></div>
                <p class="text-gray-600 text-sm">正在从链上读取并拼接 SVG...</p>
            </div>
        </div>

        <!-- 错误提示 -->
        <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm text-center"></div>

        <!-- 操作按钮 -->
        <div class="flex gap-3 justify-center mb-6">
            <button id="generateBtn" onclick="generateNFT()" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 px-8 rounded-lg transition-colors duration-200 flex items-center gap-2">
                <span>🎲</span> 随机生成 NFT
            </button>
            <button id="downloadBtn" onclick="downloadSVG()" class="hidden bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200 flex items-center gap-2">
                <span>⬇️</span> 下载 SVG
            </button>
        </div>

        <!-- Traits 详情列表 -->
        <div id="traitsList" class="hidden bg-gray-50 rounded-xl p-4 border border-gray-100">
            <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">当前生成属性</h3>
            <div id="traitsContent" class="space-y-2">
                <!-- 动态插入 -->
            </div>
        </div>
    </div>

    <script>
        // ================= 配置区 =================
        const RPC_URL = "https://bsc-dataseed.binance.org/";
        const CONTRACT_ADDRESS = "0x17e1c9844052d6CC9Fb1dCd7Ed2646673Bca3080";
        
        // 严格按照正确的图层渲染顺序 (从底层到顶层)
        const LAYER_ORDER = ["Background", "Fur", "Clothes", "Eyes", "Hat", "Mouth", "Earring"];

        const ABI = [
            "function getLayerSummary() view returns (string[], uint256[])",
            "function traitName(uint256 layerId, uint256 traitId) view returns (string)",
            "function traitSVG(uint256 layerId, uint256 traitId) view returns (string)"
        ];

        let provider;
        let contract;
        let currentSvgString = "";

        // 初始化区块链连接
        async function init() {
            try {
                provider = new ethers.JsonRpcProvider(RPC_URL);
                contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);
                // 测试连接
                await contract.layerCount(); 
                console.log("✅ 合约连接成功");
            } catch (err) {
                console.error("初始化失败:", err);
                showError("连接 BSC 节点失败，请检查网络或稍后刷新页面重试。");
            }
        }

        // 核心生成逻辑
        async function generateNFT() {
            const btn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const img = document.getElementById('nftImage');
            const placeholder = document.getElementById('placeholder');
            const traitsList = document.getElementById('traitsList');
            const traitsContent = document.getElementById('traitsContent');

            // 重置 UI 状态
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            downloadBtn.classList.add('hidden');
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            errorDiv.classList.add('hidden');
            img.classList.add('hidden');
            placeholder.classList.add('hidden');
            traitsList.classList.add('hidden');
            traitsContent.innerHTML = '';

            try {
                // 1. 获取链上图层摘要 (名称和数量)
                const [layerNames, traitCounts] = await contract.getLayerSummary();
                
                let svgParts = [];
                let selectedTraits = [];

                // 2. 按照 LAYER_ORDER 严格顺序遍历
                for (let i = 0; i < LAYER_ORDER.length; i++) {
                    const expectedName = LAYER_ORDER[i];
                    
                    // 防御性校验：确保链上顺序与预期一致
                    if (layerNames[i] !== expectedName) {
                        throw new Error(`链上图层顺序异常！预期: ${expectedName}, 实际: ${layerNames[i]}`);
                    }

                    const count = Number(traitCounts[i]);
                    if (count === 0) continue;

                    // 随机选择一个 Trait 索引
                    const randomIndex = Math.floor(Math.random() * count);
                    
                    // 并发读取名称和 SVG 数据，大幅提升加载速度
                    const [name, svgContent] = await Promise.all([
                        contract.traitName(i, randomIndex),
                        contract.traitSVG(i, randomIndex)
                    ]);

                    selectedTraits.push({ layer: expectedName, name: name });
                    
                    // 如果 SVG 内容不为空，则加入拼接数组
                    if (svgContent && svgContent.trim() !== "") {
                        svgParts.push(svgContent);
                    }
                }

                // 3. 拼接最终的 SVG 字符串
                // 注意：viewBox="0 0 1000 1000" 是此类生成艺术的标准坐标系，width/height="500" 用于控制显示尺寸
                currentSvgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="500" height="500">
    ${svgParts.join('\n    ')}
</svg>`;

                // 4. 转换为 Base64 并显示图片
                // 使用 encodeURIComponent 确保处理可能的特殊字符
                const base64Svg = btoa(unescape(encodeURIComponent(currentSvgString)));
                img.src = `data:image/svg+xml;base64,${base64Svg}`;
                
                // 5. 更新 UI
                img.classList.remove('hidden');
                downloadBtn.classList.remove('hidden');
                
                selectedTraits.forEach(trait => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center py-2 border-b border-gray-200 last:border-0';
                    div.innerHTML = `
                        <span class="text-sm font-medium text-gray-500">${trait.layer}</span>
                        <span class="text-sm font-bold text-gray-800 bg-gray-200 px-2 py-1 rounded">${trait.name}</span>
                    `;
                    traitsContent.appendChild(div);
                });
                traitsList.classList.remove('hidden');

            } catch (err) {
                console.error("生成失败:", err);
                showError("生成失败: " + (err.message || "未知错误。请检查控制台或稍后重试。"));
                placeholder.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                loading.classList.add('hidden');
                loading.classList.remove('flex');
            }
        }

        // 下载 SVG 文件功能
        function downloadSVG() {
            if (!currentSvgString) return;
            const blob = new Blob([currentSvgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `OnChain_NFT_${Date.now()}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
