<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShibLaunchpad - 合约管理面板</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f1ec;--bg2:#fff;--bg3:#faf8f5;
  --card:#fff;--card-hover:#fefcf9;
  --border:#e2ddd5;--border-h:#d4a843;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --accent:#d4a843;--accent2:#b8922e;--accent-bg:rgba(212,168,67,0.08);
  --green:#1a9d6c;--green-bg:rgba(26,157,108,0.08);
  --red:#d94444;--red-bg:rgba(217,68,68,0.08);
  --blue:#2d7dd2;--blue-bg:rgba(45,125,210,0.08);
  --radius:10px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,0.04),0 4px 12px rgba(0,0,0,0.03);
  --shadow-lg:0 4px 20px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
  --font-display:'Space Grotesk','Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --font-body:'Noto Sans SC','Space Grotesk',sans-serif;
}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh}
a{color:var(--accent2);text-decoration:none;font-weight:500}a:hover{text-decoration:underline;color:var(--accent)}

/* HEADER */
.header{background:linear-gradient(135deg,#1a1a1a 0%,#2a2520 50%,#1a1a1a 100%);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:68px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.15)}
.header-left{display:flex;align-items:center;gap:14px}
.logo-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#e8c468);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#1a1a1a;font-size:18px;box-shadow:0 2px 10px rgba(212,168,67,0.3)}
.header h1{font-family:var(--font-display);font-size:1.25rem;font-weight:700;color:#fff;letter-spacing:-0.01em}
.header h1 span{color:var(--accent);font-weight:600}
.header-right{display:flex;align-items:center;gap:10px}
.chain-badge{font-family:var(--font-mono);font-size:0.72rem;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.7);font-weight:500}
.wallet-btn{font-family:var(--font-mono);font-size:0.8rem;padding:8px 20px;border-radius:var(--radius);border:2px solid var(--accent);background:var(--accent);color:#1a1a1a;cursor:pointer;transition:all .2s;font-weight:700}
.wallet-btn:hover{background:#e8c468;box-shadow:0 0 24px rgba(212,168,67,0.4)}
.wallet-btn.connected{border-color:var(--green);background:var(--green);color:#fff}
.wallet-btn.connected:hover{background:#22b87a}

.container{max-width:1200px;margin:0 auto;padding:24px 20px 60px}

/* OWNER BAR */
.owner-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:20px;font-size:0.85rem;box-shadow:var(--shadow)}
.owner-bar .label{color:var(--text2);white-space:nowrap;font-weight:500}
.owner-bar .addr{font-family:var(--font-mono);color:var(--accent2);font-weight:600}
.badge{font-size:0.72rem;padding:3px 10px;border-radius:12px;font-weight:600}
.badge.ok{color:var(--green);background:var(--green-bg);border:1px solid rgba(26,157,108,0.2)}
.badge.no{color:var(--red);background:var(--red-bg);border:1px solid rgba(217,68,68,0.2)}

/* TABS */
.tabs{display:flex;gap:2px;margin-bottom:24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:4px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:0.82rem;padding:10px 18px;cursor:pointer;border:none;background:none;color:var(--text2);font-family:var(--font-body);font-weight:600;white-space:nowrap;border-radius:var(--radius);transition:all .2s}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{color:var(--accent2);background:var(--accent-bg);box-shadow:inset 0 -2px 0 var(--accent)}

/* PANEL */
.panel{display:none;animation:fadeIn .2s ease}.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* CONTRACT INFO GRID */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:20px}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:border-color .15s}
.info-card:hover{border-color:var(--border-h)}
.info-label{font-size:0.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;font-family:var(--font-mono);font-weight:600}
.info-value{font-family:var(--font-mono);font-size:0.82rem;color:var(--text);word-break:break-all;font-weight:500}
.info-value a{font-family:var(--font-mono);font-size:0.82rem}

/* SECTIONS */
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.section-title{font-size:0.92rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-family:var(--font-display)}
.section-title .icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.icon-gold{background:var(--accent-bg);color:var(--accent)}
.icon-green{background:var(--green-bg);color:var(--green)}
.icon-red{background:var(--red-bg);color:var(--red)}
.icon-blue{background:var(--blue-bg);color:var(--blue)}
.section-hint{font-size:0.8rem;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:4px;line-height:1.6}

/* FORM */
.form-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-end;flex-wrap:wrap}
.form-group{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:0.72rem;color:var(--text2);font-family:var(--font-mono);font-weight:600}
.form-group input,.form-group select{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-family:var(--font-mono);font-size:0.82rem;outline:none;transition:border-color .2s,box-shadow .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.form-group input::placeholder{color:var(--text3)}

/* BUTTONS */
.btn{font-family:var(--font-body);font-size:0.82rem;font-weight:600;padding:9px 20px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--text3);background:var(--card)}
.btn:active{transform:scale(0.98)}
.btn-gold{border-color:var(--accent);color:var(--accent2);background:var(--accent-bg);font-weight:700}
.btn-gold:hover{background:var(--accent);color:#1a1a1a;box-shadow:0 2px 12px rgba(212,168,67,0.25)}
.btn-green{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.btn-green:hover{background:var(--green);color:#fff}
.btn-red{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.btn-red:hover{background:var(--red);color:#fff}
.btn:disabled{opacity:0.4;cursor:not-allowed}

/* STATUS */
.status-bar{font-family:var(--font-mono);font-size:0.78rem;padding:10px 14px;border-radius:var(--radius);margin-top:12px;display:none;line-height:1.5}
.status-bar.info{display:block;background:var(--blue-bg);border:1px solid rgba(45,125,210,0.2);color:var(--blue)}
.status-bar.success{display:block;background:var(--green-bg);border:1px solid rgba(26,157,108,0.2);color:var(--green)}
.status-bar.error{display:block;background:var(--red-bg);border:1px solid rgba(217,68,68,0.2);color:var(--red)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* SPINNER */
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--text3);border-top-color:var(--accent);border-radius:50%;animation:spin .5s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE */
@media(max-width:768px){
  .info-grid{grid-template-columns:1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .form-row{flex-direction:column}
  .header{padding:0 16px;height:56px}
  .header h1{font-size:1rem}
  .container{padding:16px 12px 40px}
}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="logo-mark">S</div>
    <h1>ShibLaunchpad <span>Owner Panel</span></h1>
  </div>
  <div class="header-right">
    <span class="chain-badge" id="chainBadge">Ethereum Mainnet</span>
    <button class="wallet-btn" id="connectBtn" onclick="connectWallet()">连接钱包</button>
  </div>
</div>
<div class="container">
  <div class="owner-bar" id="ownerBar" style="display:none">
    <span class="label">当前钱包:</span>
    <span class="addr" id="walletAddr">-</span>
    <span id="ownerMatch"></span>
  </div>
  <div class="tabs" id="tabBar">
    <button class="tab active" data-tab="factoryAdmin">FactoryAdmin</button>
    <button class="tab" data-tab="feeEscrow">FeeEscrow</button>
    <button class="tab" data-tab="launchFactory">LaunchFactory</button>
    <button class="tab" data-tab="launchHook">LaunchHook</button>
    <button class="tab" data-tab="launchRouter">LaunchRouter</button>
  </div>
  <div id="panels"></div>
</div>
<script>
// ========== CONTRACT ADDRESSES ==========
const C = {
  FactoryAdmin:  '0x100a7553964e8f067304c919291cE5CE6Bb63cBE',
  FeeEscrow:     '0x3B1F96520a46c0feCA00A7E754102bB88D20F53D',
  LaunchFactory: '0x22Bd828827579203239Df53F159C77502433Dc58',
  LaunchHook:    '0x8e96674Cf27F5e8e1cED334be4ECDcB6D86e1098',
  LaunchRouter:  '0x07706eb53B44c09306B03C0482EA58143F88d80c',
};
const ES = 'https://etherscan.io/address/';
const TX = 'https://etherscan.io/tx/';

// ========== ABIs ==========
const O2 = [
  'function owner() view returns (address)',
  'function pendingOwner() view returns (address)',
  'function transferOwnership(address)',
  'function acceptOwnership()',
];
const ABI_FA = [...O2,
  'function treasury() view returns (address)',
  'function router() view returns (address)',
  'function hook() view returns (address)',
  'function creationFee() view returns (uint256)',
  'function paused() view returns (bool)',
  'function blacklist(address) view returns (bool)',
  'function setHook(address)',
  'function setRouter(address)',
  'function registerQuote(address)',
  'function disableQuote(address)',
  'function setCreationFee(uint256)',
  'function setTreasury(address)',
  'function setPaused(bool)',
  'function setBlacklist(address, bool)',
  'function setBlacklistBatch(address[], bool)',
];
const ABI_FE = [...O2,
  'function hook() view returns (address)',
  'function factory() view returns (address)',
  'function platformRecipient() view returns (address)',
  'function setHook(address)',
  'function setFactory(address)',
  'function setPlatformRecipient(address)',
  'function distribute()',
  'function distributeRange(uint256, uint256)',
  'function distributeFor(uint256)',
];
const ABI_LF = [...O2, 'function launchCount() view returns (uint256)', 'function admin() view returns (address)'];
const ABI_LH = [...O2, 'function trackerShareBps() view returns (uint256)', 'function setTrackerShareBps(uint256)', 'function escrow() view returns (address)', 'function factory() view returns (address)'];
const ABI_LR = [...O2, 'function setEthRoute(address, bytes)', 'function rescue(address, address)', 'function ethRoute(address) view returns (bytes)'];

// ========== STATE ==========
let provider=new ethers.JsonRpcProvider('https://ethereum-rpc.publicnode.com'), signer=null, userAddr=null, curTab='factoryAdmin';

// ========== WALLET ==========
async function connectWallet(){
  if(!window.ethereum){alert('请安装 MetaMask');return}
  try{
    provider=new ethers.BrowserProvider(window.ethereum);
    await provider.send('eth_requestAccounts',[]);
    signer=await provider.getSigner();
    userAddr=await signer.getAddress();
    const b=document.getElementById('connectBtn');
    b.textContent=shorten(userAddr);b.classList.add('connected');
    document.getElementById('walletAddr').textContent=userAddr;
    document.getElementById('ownerBar').style.display='flex';
    await checkChain();
    render();
    window.ethereum.on('accountsChanged',async a=>{
      if(!a.length){disconnect();return}
      userAddr=a[0];b.textContent=shorten(userAddr);
      document.getElementById('walletAddr').textContent=userAddr;
      await checkChain();render();
    });
    window.ethereum.on('chainChanged',async()=>{window.location.reload()});
  }catch(e){alert('连接失败: '+e.message)}
}
function disconnect(){
  userAddr=null;signer=null;provider=new ethers.JsonRpcProvider('https://ethereum-rpc.publicnode.com');
  const b=document.getElementById('connectBtn');
  b.textContent='连接钱包';b.classList.remove('connected');
  document.getElementById('ownerBar').style.display='none';
  render();
}
function shorten(a){return a?a.slice(0,6)+'...'+a.slice(-4):''}
function link(a){return `<a href="${ES}${a}" target="_blank">${shorten(a)}</a>`}
function ctr(name,abi){return new ethers.Contract(C[name],abi,signer||provider)}
function setStatus(id,msg,type){const e=document.getElementById(id);if(!e)return;e.className='status-bar '+type;e.innerHTML=msg}
function showError(id,msg){const e=document.getElementById(id);if(e)e.innerHTML=`<span style="color:var(--red)">加载失败: ${msg}</span>`}
async function txW(p,id,ok){
  setStatus(id,'<span class="spinner"></span> 交易发送中...','info');
  try{
    const t=await p;
    setStatus(id,`<span class="spinner"></span> 等待确认... <a href="${TX}${t.hash}" target="_blank">${shorten(t.hash)}</a>`,'info');
    const r=await t.wait();
    setStatus(id,`${ok} <a href="${TX}${r.hash}" target="_blank">查看交易</a>`,'success');
    return r;
  }catch(e){setStatus(id,'失败: '+(e.reason||e.message),'error');return null}
}
function ownerBadge(owner){
  if(!userAddr)return '';
  return userAddr.toLowerCase()===owner.toLowerCase()?'<span class="badge ok">当前钱包是 Owner</span>':'<span class="badge no">非 Owner</span>';
}
async function checkChain(){
  if(!window.ethereum)return true;
  try{
    const chainId=await window.ethereum.request({method:'eth_chainId'});
    const num=parseInt(chainId,16);
    if(num!==1){
      document.getElementById('chainBadge').textContent='⚠ 错误网络 (Chain '+num+')';
      document.getElementById('chainBadge').style.color='#ef5f5f';
      return false;
    }
    document.getElementById('chainBadge').textContent='Ethereum Mainnet';
    return true;
  }catch(e){return true}
}

// ========== TABS ==========
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');curTab=t.dataset.tab;render();
}));
function render(){
  const m={factoryAdmin:rFA,feeEscrow:rFE,launchFactory:rLF,launchHook:rLH,launchRouter:rLR};
  (m[curTab]||rFA)();
}

// ========== OWNERSHIP HTML BUILDER ==========
function ownHTML(pfx){
  return `<div class="section">
    <div class="section-title"><span class="icon icon-gold">&#128273;</span>所有权管理 (Ownable2Step)</div>
    <div class="grid-2">
      <div>
        <div class="form-row"><div class="form-group"><label>第一步: 发起转让 (transferOwnership)</label><input id="${pfx}_txAddr" placeholder="新 Owner 地址 0x..."></div></div>
        <div class="form-row"><button class="btn btn-gold" onclick="${pfx}_transfer()">发起转让</button></div>
      </div>
      <div>
        <div class="form-row"><div class="form-group"><label>第二步: 接受转让 (acceptOwnership) — 需新Owner钱包</label></div></div>
        <div class="form-row"><button class="btn btn-green" onclick="${pfx}_accept()">接受所有权</button></div>
      </div>
    </div>
    <div class="status-bar" id="${pfx}_ownSt"></div>
  </div>`;
}
async function fillOwner(pfx,contract){
  const [o,p]=await Promise.all([contract.owner(),contract.pendingOwner()]);
  document.getElementById(pfx+'_owner').innerHTML=link(o)+' '+ownerBadge(o);
  document.getElementById(pfx+'_pending').innerHTML=p===ethers.ZeroAddress?'<span style="color:var(--text3)">无</span>':link(p);
  return o;
}

// ========== FACTORY ADMIN ==========
async function rFA(){
  const p=document.getElementById('panels');
  p.innerHTML=`<div class="panel active">
    <div class="info-grid">
      <div class="info-card"><div class="info-label">合约地址</div><div class="info-value">${link(C.FactoryAdmin)}</div></div>
      <div class="info-card"><div class="info-label">当前 Owner</div><div class="info-value" id="fa_owner"><span class="spinner"></span></div></div>
      <div class="info-card"><div class="info-label">Pending Owner</div><div class="info-value" id="fa_pending"><span class="spinner"></span></div></div>
      <div class="info-card"><div class="info-label">Treasury</div><div class="info-value" id="fa_treasury"><span class="spinner"></span></div></div>
      <div class="info-card"><div class="info-label">Router</div><div class="info-value" id="fa_router"><span class="spinner"></span></div></div>
      <div class="info-card"><div class="info-label">Hook</div><div class="info-value" id="fa_hook"><span class="spinner"></span></div></div>
      <div class="info-card"><div class="info-label">Creation Fee</div><div class="info-value" id="fa_fee"><span class="spinner"></span></div></div>
      <div class="info-card"><div class="info-label">Paused</div><div class="info-value" id="fa_paused"><span class="spinner"></span></div></div>
    </div>
    ${ownHTML('fa')}
    <div class="section">
      <div class="section-title"><span class="icon icon-blue">&#9881;</span>配置管理</div>
      <div class="grid-2">
        <div><div class="form-row"><div class="form-group"><label>设置 Treasury</label><input id="fa_treasury_addr" placeholder="Treasury 地址"></div></div>
        <div class="form-row"><button class="btn btn-gold" onclick="fa_setTreasury()">设置</button></div></div>
        <div><div class="form-row"><div class="form-group"><label>设置 Router</label><input id="fa_router_addr" placeholder="Router 地址"></div></div>
        <div class="form-row"><button class="btn btn-gold" onclick="fa_setRouter()">设置</button></div></div>
        <div><div class="form-row"><div class="form-group"><label>设置 Creation Fee (ETH)</label><input id="fa_fee_val" placeholder="例如 0.001"></div></div>
        <div class="form-row"><button class="btn btn-gold" onclick="fa_setFee()">设置</button></div></div>
        <div><div class="form-row"><div class="form-group"><label>注册 Quote Token</label><input id="fa_qreg" placeholder="Quote Token 地址"></div></div>
        <div class="form-row"><button class="btn btn-gold" onclick="fa_regQuote()">注册</button></div></div>
        <div><div class="form-row"><div class="form-group"><label>禁用 Quote Token</label><input id="fa_qdis" placeholder="Quote Token 地址"></div></div>
        <div class="form-row"><button class="btn btn-red" onclick="fa_disQuote()">禁用</button></div></div>
      </div>
      <div class="status-bar" id="fa_cfgSt"></div>
    </div>
    <div class="section">
      <div class="section-title"><span class="icon icon-red">&#9888;</span>暂停 / 黑名单</div>
      <div class="grid-2">
        <div>
          <div class="form-row">
            <button class="btn btn-red" onclick="fa_pause(true)">暂停发币</button>
            <button class="btn btn-green" onclick="fa_pause(false)" style="margin-left:8px">恢复发币</button>
          </div>
        </div>
        <div>
          <div class="form-row"><div class="form-group"><label>黑名单地址</label><input id="fa_blAddr" placeholder="地址 0x..."></div></div>
          <div class="form-row">
            <button class="btn btn-red" onclick="fa_bl(true)">加入黑名单</button>
            <button class="btn btn-green" onclick="fa_bl(false)" style="margin-left:8px">移出黑名单</button>
          </div>
        </div>
      </div>
      <div class="form-row" style="margin-top:8px">
        <div class="form-group"><label>批量黑名单 (逗号分隔地址)</label><input id="fa_blBatch" placeholder="0x...,0x..."></div>
        <button class="btn btn-red" onclick="fa_blBatch(true)">批量拉黑</button>
        <button class="btn btn-green" onclick="fa_blBatch(false)" style="margin-left:4px">批量解除</button>
      </div>
      <div class="status-bar" id="fa_blSt"></div>
    </div>
  </div>`;

  try{
    const c=ctr('FactoryAdmin',ABI_FA);
    const [o,,treasury,router,hook,fee,paused]=await Promise.all([c.owner(),c.pendingOwner(),c.treasury(),c.router(),c.hook(),c.creationFee(),c.paused()]);
    await fillOwner('fa',c);
    document.getElementById('fa_treasury').innerHTML=link(treasury);
    document.getElementById('fa_router').innerHTML=link(router);

function fa_bl(v){const a=document.getElementById('fa_blAddr').value.trim();if(!ethers.isAddress(a)){setStatus('fa_blSt','地址无效','error');return}txW(ctr('FactoryAdmin',ABI_FA).setBlacklist(a,v),'fa_blSt',v?'已拉黑':'已解除')}
function fa_blBatch(v){
  const raw=document.getElementById('fa_blBatch').value.trim();
  const addrs=raw.split(',').map(s=>s.trim()).filter(s=>ethers.isAddress(s));
  if(!addrs.length){setStatus('fa_blSt','无有效地址','error');return}
  txW(ctr('FactoryAdmin',ABI_FA).setBlacklistBatch(addrs,v),'fa_blSt',v?`已批量拉黑 ${addrs.length} 个`:`已批量解除 ${addrs.length} 个`);
}

// ========== FEE ESCROW ==========
async function rFE(){
  const p=document.getElementById('panels');
  p.innerHTML=`<div class="panel active">

        <button class="btn btn-gold" onclick="fe_distRange()">范围分发</button>
        <div class="form-group"><label>单个分发 (索引)</label><input id="fe_dIdx" placeholder="索引" style="width:70px"></div>
        <button class="btn btn-gold" onclick="fe_distFor()">分发</button>
      </div>
      <div class="status-bar" id="fe_distSt"></div>

  </div>`;

  try{
    const c=ctr('FeeEscrow',ABI_FE);

    const [hook,factory,recip]=await Promise.all([c.hook(),c.factory(),c.platformRecipient()]);
    document.getElementById('fe_hook').innerHTML=hook===ethers.ZeroAddress?'<span style="color:var(--text3)">未设置</span>':link(hook);
    document.getElementById('fe_factory').innerHTML=factory===ethers.ZeroAddress?'<span style="color:var(--text3)">未设置</span>':link(factory);

  }catch(e){console.error(e);showError('fe_owner','RPC 错误，请刷新重试')}

function fe_transfer(){const a=document.getElementById('fe_txAddr').value.trim();if(!ethers.isAddress(a)){setStatus('fe_ownSt','地址无效','error');return}txW(ctr('FeeEscrow',ABI_FE).transferOwnership(a),'fe_ownSt','转让已发起')}
function fe_accept(){txW(ctr('FeeEscrow',ABI_FE).acceptOwnership(),'fe_ownSt','已接受').then(()=>setTimeout(rFE,2000))}
function fe_setRecip(){const a=document.getElementById('fe_recipAddr').value.trim();if(!ethers.isAddress(a)){setStatus('fe_cfgSt','地址无效','error');return}txW(ctr('FeeEscrow',ABI_FE).setPlatformRecipient(a),'fe_cfgSt','Platform Recipient 已更新')}
function fe_dist(){txW(ctr('FeeEscrow',ABI_FE).distribute(),'fe_distSt','分发完成')}
function fe_distRange(){const s=parseInt(document.getElementById('fe_dStart').value),n=parseInt(document.getElementById('fe_dCount').value);if(isNaN(s)||isNaN(n)){setStatus('fe_distSt','参数无效','error');return}txW(ctr('FeeEscrow',ABI_FE).distributeRange(s,n),'fe_distSt','范围分发完成')}
